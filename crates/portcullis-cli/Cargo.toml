[package]
name = "portcullis-cli"
description = "Command line interface for the portcullis MCP gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "portcullis"
path = "src/main.rs"

[dependencies]
portcullis-policy.workspace = true
portcullis-proxy.workspace = true
portcullis-scan.workspace = true

clap = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "io-util"] }

[lints]
workspace = true
