version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine patch churn, separate PRs for anything that
      # could actually break a build.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # dtolnay/rust-toolchain is referenced by a *version tag* in the MSRV
      # job (`@1.85.0`), which dependabot reads as an action version and tries
      # to bump. Accepting that would silently raise the MSRV floor, which is
      # the one thing that job exists to hold, so the ref is pinned by hand.
      - dependency-name: dtolnay/rust-toolchain
